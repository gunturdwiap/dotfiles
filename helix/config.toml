theme = "tokyonight"

[editor]
line-number = "relative"
bufferline = "multiple"
cursorline = true
color-modes = true
auto-completion = true
default-yank-register = "+"
soft-wrap.enable = true
inline-diagnostics.cursor-line = "hint"

[editor.cursor-shape]
insert = "bar"

[editor.statusline]
left = [
  "mode",
  "spacer",
  "spinner",
  "spacer",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type", "version-control"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.indent-guides]
render = true
skip-levels = 1

[keys.normal]
x = "select_line_below"
X = "select_line_above"
esc = ["collapse_selection", "keep_primary_selection"]
