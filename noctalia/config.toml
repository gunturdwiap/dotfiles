[bar]
order = [ "good-enough", "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_border = "primary"
    capsule_padding = 10.0
    capsule_radius = 4
    center = []
    enabled = false
    end = [ "tray", "media", "volume", "bluetooth", "network", "group:g1", "battery", "clock", "clipboard" ]
    font_family = "JetBrainsMono Nerd Font"
    font_weight = 400
    shadow = false
    start = [ "settings", "workspaces" ]

        [[bar.default.capsule_group]]
        border = "primary"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "sysmon", "ram", "temp" ]
        opacity = 1.0
        padding = 8.0
        radius = 4.0

    [bar.good-enough]
    background_opacity = 0.84999998100101948
    capsule_radius = 4
    center = []
    enabled = true
    end = [ "media", "group:g1", "battery", "tray", "group:g2", "clock", "clipboard", "notifications" ]
    margin_ends = 0
    padding = 20
    radius = 0
    shadow = false
    start = [ "settings", "workspaces", "taskbar" ]
    thickness = 28
    widget_spacing = 20

        [[bar.good-enough.capsule_group]]
        accordion = false
        accordion_direction = "start"
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 5.0
        radius = 4.0
        widget_spacing = 10

        [[bar.good-enough.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "bluetooth", "network", "volume" ]
        opacity = 1.0
        padding = 6.0
        radius = 4.0

