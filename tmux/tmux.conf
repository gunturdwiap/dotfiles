# --- General Settings ---
set -g default-terminal "screen-256color"
set -s escape-time 0
set-option -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

# --- Key Bindings ---
# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config: Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split windows/New windows with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# --- Visual Theme ---
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#7aa2f7,bg=#16161e"

set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# --- Flat Dot Indicator ---
# Normal: Green (#9ece6a) | Prefix: Red (#f7768e)
set -g status-left-length "100"
set -g status-right "#{?client_prefix,#[fg=#f7768e bg=#16161e]●,#[fg=#9ece6a bg=#16161e]●}"
set -g status-left ""

# --- Window / Tab Styling ---
setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator "   " # Small space between tabs
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"

# Inactive tabs
setw -g window-status-format "#[fg=#c0caf5]#I #W"

# Active tab
setw -g window-status-current-format "#[fg=#7aa2f7,bold]#I #W"
